<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 400px;
      margin: 60px auto;
      padding: 0 20px;
      color: #222;
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-weight: bold;
      font-size: 0.9rem;
    }

    input {
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      font-size: 1rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }

    #mensaje {
      text-align: center;
      font-weight: bold;
      min-height: 1.2em;
    }

    hr {
      margin: 24px 0;
      border: none;
      border-top: 1px solid #ddd;
    }

    .enlace {
      text-align: center;
    }
  </style>
</head>

<body>
  <main>
    <h2>Registro de Usuario</h2>

    <!-- Formulario de registro -->
    <form id="formRegistro">
      <label for="usuario">Usuario:</label>
      <input
        type="text"
        id="usuario"
        name="usuario"
        autocomplete="username"
        required
      />

      <label for="password">Contraseña:</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="new-password"
        required
      />

      <button type="submit">Registrar</button>
    </form>

    <!-- Mensaje de respuesta -->
    <p id="mensaje" role="status"></p>

    <hr />

    <p class="enlace"><a href="login.html">Ir a Login</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
